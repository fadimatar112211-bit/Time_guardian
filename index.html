<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيقي الاحترافي</title>
    <!-- ربط مكتبة الخرائط الشهيرة Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- ملف الـ CSS الخاص بنا -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط علوي احترافي -->
    <header class="app-header">
        <h1>📍 التطبيق الذكي المتكامل</h1>
        <p>مصنوع خصيصاً للعمل على الموبايل</p>
    </header>

    <!-- المحتوى الرئيسي (أقسام التطبيق) -->
    <main class="app-container">
        
        <!-- قسم الترحيب والإحصائيات -->
        <section class="card welcome-card">
            <h2>أهلاً بك مجدداً!</h2>
            <p>هذا تطبيق ويب هجين جاهز للتحويل إلى APK.</p>
            <button id="notifyBtn" class="btn-primary">اضغط للاختبار</button>
        </section>

        <!-- قسم الخريطة النظامية التفاعلية -->
        <section class="card map-card">
            <h3>خريطة الموقع النظامية</h3>
            <p>خريطة تفاعلية كاملة تحدد موقعك وتعرض النقاط الهامة:</p>
            <!-- الحاوية التي ستظهر فيها الخريطة -->
            <div id="map"></div>
        </section>

    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="app-nav">
        <a href="#" class="nav-item active">الرئيسية</a>
        <a href="#" class="nav-item">الإعدادات</a>
        <a href="#" class="nav-item">حسابي</a>
    </nav>

    <!-- مكتبة الجافاسكريفت للخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- ملف الـ JS الخاص بنا -->
    <script src="script.js"></script>
</body>
</html>
