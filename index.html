<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرسان الزمن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فرسان الزمن">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
</head>
<body>
<div id="app" dir="rtl" lang="ar">

  <!-- شاشة التحميل -->
  <div id="boot">جارٍ تشغيل آلة الزمن…</div>

  <!-- شاشة الدخول: اختيار الفريق والرقم السري، أو دخول الإدارة -->
  <section id="entry" class="entry wrap" hidden>
    <div class="entry-card">
      <div class="brand">
        <div class="dial" aria-hidden="true"></div>
        <h1>فرسان الزمن</h1>
        <p>احموا دير سمعان من الأحداث البديلة</p>
      </div>
      <div class="panel stack">
        <div class="field">
          <label>اختاروا فريقكم</label>
          <div class="team-pick" id="teamPick"></div>
        </div>
        <div class="field">
          <label for="pinInput">الرقم السري للفريق</label>
          <input id="pinInput" type="password" inputmode="numeric" maxlength="6" class="code-input" autocomplete="off">
        </div>
        <button class="btn btn-brass btn-block" id="enterBtn">دخول الفريق</button>
        <p id="entryErr" class="small" style="color: var(--bad); margin: 0;" hidden></p>
      </div>
      <button class="btn btn-ghost btn-block" id="adminBtn" hidden>غرفة العمليات (الإدارة)</button>
      <p class="mode-note" id="modeNote"></p>
    </div>
  </section>

  <!-- واجهة الفريق -->
  <section id="teamView" hidden>
    <header class="t-head wrap">
      <div class="bar">
        <div class="t-name" id="tName"></div>
        <div class="row">
          <span class="gold-big" id="tGold"></span>
          <span class="pill" data-net hidden></span>
          <span class="clock" id="tClock">--:--</span>
          <button class="btn btn-sm btn-ghost" data-logout>خروج</button>
        </div>
      </div>
      <div id="tMid" class="mid-banner" hidden></div>
      <div id="tOffline" class="offline" hidden>شاشة الإدارة غير متصلة الآن. طلباتكم ستُنفَّذ عند عودتها.</div>
    </header>
    <main class="t-main wrap">
      <div id="tab-board" class="tab-sec"></div>
      <div id="tab-centers" class="tab-sec" hidden></div>
      <div id="tab-powers" class="tab-sec" hidden></div>
      <div id="tab-team" class="tab-sec" hidden></div>
      <div id="tab-log" class="tab-sec" hidden></div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="أقسام الفريق">
      <button data-tab="board" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>الدير</button>
      <button data-tab="centers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>المراكز</button>
      <button data-tab="powers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg>القدرات</button>
      <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.5 1-4.5 3-5"/></svg>الفريق</button>
      <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>السجل</button>
    </nav>
  </section>

  <!-- واجهة الإدارة -->
  <section id="adminView" hidden>
    <header class="a-head wrap">
      <div class="bar">
        <div class="row"><h1>غرفة العمليات</h1><span class="pill" data-net hidden></span><button class="btn btn-sm btn-ghost" data-logout>خروج</button></div>
        <div class="row" id="aControls"></div>
      </div>
      <nav class="a-tabs" id="aTabs">
        <button data-atab="field" class="on">الميدان</button>
        <button data-atab="teams">الفرق</button>
        <button data-atab="alog">السجل</button>
        <button data-atab="settings">الإعداد والأكواد</button>
      </nav>
    </header>
    <main class="a-main wrap">
      <div id="aEngine"></div>
      <div id="atab-field"></div>
      <div id="atab-teams" hidden></div>
      <div id="atab-alog" hidden></div>
      <div id="atab-settings" hidden></div>
    </main>
  </section>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="alarmRoot"></div>
</div>
<!-- مكتبة الاتصال بخادم المزامنة -->
<script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
<script src="game.js"></script>
</body>
</html>
